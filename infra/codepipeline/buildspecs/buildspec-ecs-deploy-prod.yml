version: 0.2

# BuildSpec: Deploy ECS PROD
# Inputs:
#   - SourceCode: codigo do repositorio (contem este buildspec)
#   - BuildOutput: artefato do stage anterior (contem imagedefinitions.json)

env:
  variables:
    AWS_REGION: "us-east-1"
    ENV: "prod"

phases:
  build:
    commands:
      - |
        echo "=== Deploy ECS PROD ==="

        BUILD_DIR="${CODEBUILD_SRC_DIR_BuildOutput}"
        echo "Lendo imagedefinitions.json de: $BUILD_DIR"
        cat "$BUILD_DIR/imagedefinitions.json"

        NEW_IMAGE=$(python3 -c "
        import json
        data = json.load(open('${BUILD_DIR}/imagedefinitions.json'))
        print(data[0]['imageUri'])
        ")
        echo "Nova imagem: $NEW_IMAGE"

        CLUSTER="meusite-${ENV}-cluster"
        SERVICE="meusite-${ENV}-service"

        CURRENT_TASK_DEF=$(aws ecs describe-services \
          --cluster "$CLUSTER" \
          --services "$SERVICE" \
          --region $AWS_REGION \
          --query "services[0].taskDefinition" \
          --output text)
        echo "Task definition atual: $CURRENT_TASK_DEF"

        NEW_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition "$CURRENT_TASK_DEF" \
          --region $AWS_REGION \
          --query "taskDefinition" \
          --output json | python3 -c "
        import json, sys
        td = json.load(sys.stdin)
        for c in td['containerDefinitions']:
            if c['name'] == 'meusite-container':
                c['image'] = '${NEW_IMAGE}'
        for k in ['taskDefinitionArn','revision','status','requiresAttributes',
                  'compatibilities','registeredAt','registeredBy']:
            td.pop(k, None)
        print(json.dumps(td))
        ")

        echo "Registrando nova revisao da task definition..."
        NEW_REVISION=$(aws ecs register-task-definition \
          --region $AWS_REGION \
          --cli-input-json "$NEW_TASK_DEF" \
          --query "taskDefinition.taskDefinitionArn" \
          --output text)
        echo "Nova revisao: $NEW_REVISION"

        aws ecs update-service \
          --cluster "$CLUSTER" \
          --service "$SERVICE" \
          --task-definition "$NEW_REVISION" \
          --region $AWS_REGION

        echo "Aguardando service estabilizar..."
        aws ecs wait services-stable \
          --cluster "$CLUSTER" \
          --services "$SERVICE" \
          --region $AWS_REGION

        echo "=== Deploy concluido: $NEW_IMAGE ==="
        echo "Acesso PROD: https://meusite.prod.exemplo.com.br"
